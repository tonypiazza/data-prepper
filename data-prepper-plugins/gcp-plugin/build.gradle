dependencies {
    implementation project(':data-prepper-api')
    implementation project(':data-prepper-plugins:gcp-plugin-api')
    implementation libs.google.auth.oauth2.http
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.2.Final'
    implementation project(':data-prepper-plugins:secrets-common')
    implementation 'io.micrometer:micrometer-core'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    testImplementation 'org.wiremock:wiremock:3.13.2'
}

sourceSets {
    integrationTest {
        java {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
            srcDir file('src/integrationTest/java')
        }
        resources.srcDir file('src/integrationTest/resources')
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntime.extendsFrom testRuntime
}

task integrationTest(type: Test) {
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs

    useJUnitPlatform()

    classpath = sourceSets.integrationTest.runtimeClasspath
    ['tests.gcp.secrets.emulator.endpoint', 'tests.gcp.secrets.live.secret_name'].each { name ->
        if (System.getProperty(name) != null) {
            systemProperty name, System.getProperty(name)
        }
    }

    filter {
        includeTestsMatching '*IT'
    }
}

test {
    useJUnitPlatform()
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 1.0
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
