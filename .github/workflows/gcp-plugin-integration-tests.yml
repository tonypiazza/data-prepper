name: GCP plugin integration tests

on:
  push:
    paths:
      - 'data-prepper-plugins/gcp-plugin/**'
      - 'data-prepper-plugins/secrets-common/**'
      - '*gradle*'
  pull_request:
    paths:
      - 'data-prepper-plugins/gcp-plugin/**'
      - 'data-prepper-plugins/secrets-common/**'
      - '*gradle*'
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 11
          distribution: temurin
      - name: Checkout Data Prepper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Start floci-gcp
        run: docker compose -f data-prepper-plugins/gcp-plugin/docker/docker-compose.yml up -d
      - name: Wait for floci-gcp to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:4588/; then
              echo "floci-gcp is ready"
              exit 0
            fi
            sleep 3
          done
          echo "floci-gcp did not become ready in time" >&2
          exit 1
      - name: Run integration tests against floci-gcp
        run: ./gradlew data-prepper-plugins:gcp-plugin:integrationTest -Dtests.gcp.secrets.emulator.endpoint=http://localhost:4588/
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-plugin-integration-test-results
          path: '**/test-results/**/*.xml'
